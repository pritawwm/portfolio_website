        let player;
        let isPlaying = false;
        let progressInterval;
        let isPlayerReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('hidden-player', {
                height: '200', 
                width: '200',  
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PLQEyGVyr_LWc', 
                    'playsinline': 1,
                    'autoplay': 0,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
        }

        function onPlayerError(event) {
            const trackName = document.getElementById('track-name');
            if (event.data === 150 || event.data === 101) {
                trackName.textContent = "Song blocked. Skipping...";
                setTimeout(() => player.nextVideo(), 1000);
            }
        }

        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const vinyl = document.getElementById('vinyl');

        playBtn.addEventListener('click', () => {
            if (!isPlayerReady || !player) return; 
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        });

        prevBtn.addEventListener('click', () => {
            if (!isPlayerReady || !player) return;
            const playlist = player.getPlaylist();
            if (!playlist) return;
            
            const currentIndex = player.getPlaylistIndex();
            if (currentIndex === 0) {
                player.playVideoAt(playlist.length - 1);
            } else {
                player.previousVideo();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (!isPlayerReady || !player) return;
            const playlist = player.getPlaylist();
            if (!playlist) return;

            const currentIndex = player.getPlaylistIndex();
            if (currentIndex === playlist.length - 1) {
                player.playVideoAt(0);
            } else {
                player.nextVideo();
            }
        });

        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const timeText = document.getElementById('time-text');
        let isDragging = false;

        function handleSeekInteraction(e) {
            if (!isPlayerReady || !player) return;
            
            const rect = progressBar.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clickX = clientX - rect.left;
            
            clickX = Math.max(0, Math.min(clickX, rect.width));
            const widthPercentage = clickX / rect.width;
            
            progressFill.style.width = (widthPercentage * 100) + '%';
            
            const duration = player.getDuration();
            if (duration > 0) {
                const seekTime = widthPercentage * duration;
                timeText.textContent = formatTime(seekTime) + ' / ' + formatTime(duration);
            }
        }

        const startDragging = (e) => {
            isDragging = true;
            progressBar.classList.add('is-dragging');
            handleSeekInteraction(e);
        };

        const whileDragging = (e) => {
            if (isDragging) handleSeekInteraction(e);
        };

        const stopDragging = (e) => {
            if (isDragging) {
                isDragging = false;
                progressBar.classList.remove('is-dragging');
                
                const currentWidth = parseFloat(progressFill.style.width) / 100;
                if (player && typeof player.seekTo === 'function' && player.getDuration() > 0) {
                    player.seekTo(currentWidth * player.getDuration(), true);
                }
            }
        };

        progressBar.addEventListener('mousedown', startDragging);
        document.addEventListener('mousemove', whileDragging);
        document.addEventListener('mouseup', stopDragging);

        progressBar.addEventListener('touchstart', startDragging);
        document.addEventListener('touchmove', whileDragging);
        document.addEventListener('touchend', stopDragging);

        function onPlayerStateChange(event) {
            const playIcon = document.querySelector('#play-btn i');
            const trackName = document.getElementById('track-name');
            const artistName = document.getElementById('artist-name');

            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                vinyl.classList.add('spin'); 
                
                if (typeof player.getVideoData === 'function') {
                    const videoData = player.getVideoData();
                    if (videoData) {
                        const vidId = videoData.video_id;
                        
                        if (customTrackInfo[vidId]) {
                            trackName.textContent = customTrackInfo[vidId].title;
                            artistName.textContent = customTrackInfo[vidId].artist;
                        } else {
                            if (videoData.title) trackName.textContent = videoData.title;
                            if (videoData.author) artistName.textContent = videoData.author;
                        }
                    }
                }
                progressInterval = setInterval(updateProgressBar, 1000);
                
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                vinyl.classList.remove('spin'); 
                clearInterval(progressInterval);
            }
        }

        function updateProgressBar() {
            if (!player || !isPlaying || isDragging) return; 
            
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            
            if (duration > 0) {
                document.getElementById('progress-fill').style.width = ((currentTime / duration) * 100) + '%';
                document.getElementById('time-text').textContent = formatTime(currentTime) + ' / ' + formatTime(duration);
            }
        }

        function formatTime(seconds) {
            if (!seconds) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return min + ':' + (sec < 10 ? '0' + sec : sec);
        }

        document.addEventListener('keydown', function(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }

            switch(event.code) {
                case 'Space':
                case 'MediaPlayPause': 
                    event.preventDefault();
                    document.getElementById('play-btn').click();
                    break;
                    
                case 'ArrowRight':
                case 'MediaTrackNext': 
                    document.getElementById('next-btn').click();
                    break;
                    
                case 'ArrowLeft':
                case 'MediaTrackPrevious':
                    document.getElementById('prev-btn').click();
                    break;
                    
                case 'ArrowUp':
                    event.preventDefault();
                    if (isPlayerReady && player && typeof player.getVolume === 'function') {
                        let currentVol = player.getVolume();
                        player.setVolume(Math.min(currentVol + 10, 100));
                    }
                    break;
                    
                case 'ArrowDown':
                    event.preventDefault();
                    if (isPlayerReady && player && typeof player.getVolume === 'function') {
                        let currentVol = player.getVolume();
                        player.setVolume(Math.max(currentVol - 10, 0));
                    }
                    break;
            }
        });
