    <title>Lap 58 Animation</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap");

      :root {
        --bg-color: transparent;
        --text-main: #202124;
        --text-muted: #5f6368;
        --canvas-bg: #fff;
        --canvas-border: #d7ccc8;
        --ver-color: #0000aa;
        /* Light mode button colors */
        --btn-border: #7fa650;
        --btn-text: #5c7a38;
        --btn-hover-bg: #7fa650;
        --btn-hover-text: #ffffff;
      }

      :root[data-theme="dark"] {
        --text-main: #e8eaed;
        --text-muted: #9aa0a6;
        --canvas-bg: #303134;
        --canvas-border: #3c4043;
        --ver-color: #4b7bff;
        /* Dark mode button colors */
        --btn-border: #8ab4f8;
        --btn-text: #8ab4f8;
        --btn-hover-bg: #8ab4f8;
        --btn-hover-text: #202124;
      }

      body {
        font-family: "Roboto", Arial, sans-serif;
        display: block;
        background: var(--bg-color);
        margin: 0;
        padding: 0;
        overflow: hidden;
        color: var(--text-main);
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 10px 0 20px 0;
      }

      button {
        padding: 7px 16px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid var(--btn-border);
        background: transparent;
        color: var(--btn-text);
        border-radius: 999px;
        font-family: "Roboto", Arial, sans-serif;
        font-weight: 600;
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        background-color: var(--btn-hover-bg);
        color: var(--btn-hover-text);
        transform: translateY(-1px);
      }

      .dashboard {
        display: flex;
        width: 100%;
        max-width: 950px;
        margin: 0 auto;
        align-items: center;
      }
      .left-col {
        width: 45%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .right-col {
        width: 55%;
        display: flex;
        flex-direction: column;
        padding-left: 20px;
        box-sizing: border-box;
      }

      .top-stats {
        display: flex;
        justify-content: space-between;
        height: 100px;
      }
      .driver-stat {
        width: 45%;
        font-size: 16px;
        font-weight: 600;
      }
      .driver-name {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .ham-color {
        color: #00c4c4;
      }
      .ver-color {
        color: var(--ver-color);
      }

      .graph-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 10px;
      }
      .graph {
        width: 100%;
        position: relative;
      }

      .graph-title {
        text-align: center;
        font-weight: 600;
        margin-bottom: 2px;
        font-size: 14px;
        color: var(--text-muted);
      }

      canvas {
        width: 100%;
        height: auto;
        border: 1px solid var(--canvas-border);
        background: var(--canvas-bg);
        box-sizing: border-box;
        border-radius: 4px;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease;
      }
      #trackCanvas {
        border: none;
        background: transparent;
      }

      @media (max-width: 900px) {
        .dashboard {
          flex-direction: column;
        }
        .left-col {
          width: 100%;
          max-width: 350px;
          margin-bottom: 20px;
        }
        .right-col {
          width: 100%;
          padding-left: 0;
        }
        .top-stats {
          height: auto;
          margin-bottom: 15px;
        }
        .driver-name {
          font-size: 22px;
        }
        .driver-stat {
          font-size: 14px;
        }
      }
    </style>
  </head>

            4.0, 4.0, 4.0, 4.0, 4.0, 4.046296296296384, 4.509259259259303,
            4.972222222222354, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0,
            5.0, 5.0, 5.0, 5.0, 5.0, 5.167785234899366, 5.503355704698002,
            5.838926174496639, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
            6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
            6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.535714285714702, 7.0,
            7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0,
            7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0,
            7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0,
            7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0,
            7.0, 7.0, 7.0, 5.666666666666667, 5.0, 5.0, 5.0, 5.0, 4.0, 4.0, 4.0,
            4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0,
            4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0,
            4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0,
            4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0,
            4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.08955223880597, 4.33830845771149,
            4.587064676616939, 4.835820895522388, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0,
            5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0,
            5.373134328358333, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
            6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
            6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
            6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0,
          ],
        },
      };

      let frameIndex = 0;
      let playing = true;
      let totalFrames = data.time ? data.time.length : 1;
      let lastTimestamp = 0;
      let currentPlaybackTime = 0;
      const targetDuration = 86;

      const playIcon = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="vertical-align: middle; margin-right: 4px;"><path d="M8 5v14l11-7z"/></svg>`;
      const pauseIcon = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="vertical-align: middle; margin-right: 4px;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

      const trackCanvas = document.getElementById("trackCanvas");
      const speedCanvas = document.getElementById("speedCanvas");
      const throttleCanvas = document.getElementById("throttleCanvas");
      const brakeCanvas = document.getElementById("brakeCanvas");
      const ctxTrack = trackCanvas.getContext("2d");
      const ctxSpeed = speedCanvas.getContext("2d");
      const ctxThrottle = throttleCanvas.getContext("2d");
      const ctxBrake = brakeCanvas.getContext("2d");

      let minX = data.track_x ? Math.min(...data.track_x) : 0,
        maxX = data.track_x ? Math.max(...data.track_x) : 100;
      let minY = data.track_y ? Math.min(...data.track_y) : 0,
        maxY = data.track_y ? Math.max(...data.track_y) : 100;

      function getTrackXY(x, y) {
        let pad = 20,
          w = trackCanvas.width,
          h = trackCanvas.height;
        let scaleX = (w - pad * 2) / (maxX - minX);
        let scaleY = (h - pad * 2) / (maxY - minY);
        let scale = Math.min(scaleX, scaleY);
        let offsetX = (w - (maxX - minX) * scale) / 2;
        let offsetY = (h - (maxY - minY) * scale) / 2;
        return {
          x: (x - minX) * scale + offsetX,
          y: h - ((y - minY) * scale + offsetY),
        };
      }

      function drawTrack(isDark, verColor) {
        if (!data.track_x) return;
        ctxTrack.clearRect(0, 0, trackCanvas.width, trackCanvas.height);
        ctxTrack.lineWidth = 14;
        ctxTrack.lineJoin = "round";
        ctxTrack.lineCap = "round";
        ctxTrack.strokeStyle = isDark ? "#3c4043" : "#555";
        ctxTrack.beginPath();
        for (let i = 0; i < data.track_x.length; i++) {
          let pt = getTrackXY(data.track_x[i], data.track_y[i]);
          if (i === 0) ctxTrack.moveTo(pt.x, pt.y);
          else ctxTrack.lineTo(pt.x, pt.y);
        }
        ctxTrack.stroke();

        let hamPt = getTrackXY(data.ham.x[frameIndex], data.ham.y[frameIndex]);
        ctxTrack.fillStyle = "#00c4c4";
        ctxTrack.beginPath();
        ctxTrack.arc(hamPt.x, hamPt.y, 10, 0, Math.PI * 2);
        ctxTrack.fill();
        ctxTrack.lineWidth = 2;
        ctxTrack.strokeStyle = isDark ? "#202124" : "white";
        ctxTrack.stroke();

        let verPt = getTrackXY(data.ver.x[frameIndex], data.ver.y[frameIndex]);
        ctxTrack.fillStyle = verColor;
        ctxTrack.beginPath();
        ctxTrack.arc(verPt.x, verPt.y, 10, 0, Math.PI * 2);
        ctxTrack.fill();
        ctxTrack.stroke();
      }

      function drawGraph(ctx, canvas, dataKey, maxVal, isDark, verColor) {
        if (!data.ham) return;
        let w = canvas.width,
          h = canvas.height;
        let padY = 4;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = isDark ? "#3c4043" : "#eee";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        function drawLine(driverData, color) {
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let i = 0; i <= frameIndex; i++) {
            let x = (i / totalFrames) * w;
            let val = Math.min(Math.max(driverData[i], 0), maxVal);
            let y = h - padY - (val / maxVal) * (h - 2 * padY);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        drawLine(data.ham[dataKey], "#00c4c4");
        drawLine(data.ver[dataKey], verColor);

        let curX = (frameIndex / totalFrames) * w;
        ctx.strokeStyle = isDark ? "rgba(255,255,255,0.3)" : "rgba(0,0,0,0.5)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(curX, 0);
        ctx.lineTo(curX, h);
        ctx.stroke();
      }

      function updateText() {
        if (!data.ham) return;
        document.getElementById("ham_rpm").innerText = Math.round(
          data.ham.rpm[frameIndex],
        );
        document.getElementById("ver_rpm").innerText = Math.round(
          data.ver.rpm[frameIndex],
        );
        document.getElementById("ham_gear").innerText = Math.round(
          data.ham.gear[frameIndex],
        );
        document.getElementById("ver_gear").innerText = Math.round(
          data.ver.gear[frameIndex],
        );
      }

      function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let deltaTime = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (playing && frameIndex < totalFrames - 1) {
          currentPlaybackTime += deltaTime;
          let progress = currentPlaybackTime / targetDuration;
          frameIndex = Math.floor(progress * totalFrames);

          if (frameIndex >= totalFrames - 1) {
            frameIndex = totalFrames - 1;
            playing = false;
            document.getElementById("playBtn").innerHTML =
              playIcon + "Finished";
          }
        }

        const isDark = document.documentElement.dataset.theme === "dark";
        const verColor = isDark ? "#4b7bff" : "#0000aa";

        updateText();
        drawTrack(isDark, verColor);
        drawGraph(ctxSpeed, speedCanvas, "speed", 330, isDark, verColor);
        drawGraph(
          ctxThrottle,
          throttleCanvas,
          "throttle",
          100,
          isDark,
          verColor,
        );
        drawGraph(ctxBrake, brakeCanvas, "brake", 100, isDark, verColor);

        if (playing && frameIndex < totalFrames - 1) {
          requestAnimationFrame(animate);
        } else if (!playing) {
          // Ensure it draws the static frame when paused (to catch theme toggles while paused)
          requestAnimationFrame(animate);
        }
      }

      function togglePlay() {
        playing = !playing;
        document.getElementById("playBtn").innerHTML = playing
          ? pauseIcon + "Pause"
          : playIcon + "Play";
        if (playing) {
          lastTimestamp = performance.now();
        }
      }

      function resetAnim() {
        currentPlaybackTime = 0;
        frameIndex = 0;
        if (!playing) {
          playing = true;
          document.getElementById("playBtn").innerHTML = pauseIcon + "Pause";
        }
        lastTimestamp = performance.now();
      }

      requestAnimationFrame(animate);
    </script>
